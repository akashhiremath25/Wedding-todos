name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*' # This triggers the workflow ONLY when you push a tag starting with 'v' (like v1.0.5)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$ENCODED_STRING" | base64 --decode > app/release-key.jks
          # Fail fast with a clear message instead of a confusing signing error later.
          if [ ! -s app/release-key.jks ]; then
            echo "::error::release-key.jks is empty after decoding — check the KEYSTORE_B64 secret"
            exit 1
          fi

      - name: Create local.properties
        run: |
          echo "KEYSTORE_PATH=release-key.jks" >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "GITHUB_PAT=${{ secrets.GITHUB_PAT }}" >> local.properties

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}